[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "otverify"
version = "0.0.1"
description = "Static analysis + SMT verifier for Opentrons liquid-handling protocols"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["z3-solver>=4.12"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
otverify = "otverify.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"otverify.data" = ["*.json", "LICENSE-*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["experiments", "tests/fixtures", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
